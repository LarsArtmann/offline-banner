name: Website

on:
  push:
    branches: [master]
    paths:
      - website/**
      - .github/workflows/website.yml
  pull_request:
    branches: [master]
    paths:
      - website/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Enable pnpm via corepack
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          corepack prepare pnpm@11.20.0 --activate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install
        working-directory: website

      # The 2ccdf6e incident: a swept ^7 bump silently removed astro check
      # (it refuses TypeScript 7) for days behind a green build. The lock
      # pins 6.0.3 and peers block <7 — this assert turns a future drift
      # into a loud red instead of a quiet loss of type-checking.
      - name: Assert TypeScript major stays 6
        run: |
          major=$(node -p "require('typescript/package.json').version.split('.')[0]")
          echo "resolved TypeScript major: $major"
          [ "$major" = "6" ] || { echo "::error::TypeScript major drift (want 6): astro check silently refuses TS7"; exit 1; }
        working-directory: website

      - name: pnpm audit
        run: pnpm audit --audit-level=high --omit=dev
        working-directory: website
        continue-on-error: true

      - run: pnpm exec astro check
        working-directory: website

      - run: pnpm run build
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: HTML Validation
        run: pnpm exec html-validate --config .htmlvalidate.json "dist/**/*.html"
        working-directory: website

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-dist
          path: website/dist/

  deploy-website:
    name: Deploy Website
    needs: build-website
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-dist
          path: website/dist/

      - name: Deploy to Firebase Hosting
        working-directory: website
        if: env.HAS_DEPLOY_KEY == 'true'
        # The AGENTS.md recipe: firebase-tools via nix, pinned to a proven
        # nixpkgs rev (moved in lockstep with the workflow-lint pin; the
        # flake lock has moved on since), so the deploy tool never floats.
        # The secret MUST be materialized to the credentials file here —
        # the 2026-11-05 hardening dropped the printf and every deploy
        # since died "Failed to authenticate" for 13 days while the lint
        # stayed green. GOOGLE_APPLICATION_CREDENTIALS is the standard
        # file-based ADC contract; runner.temp is per-job scratch.
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          nix shell github:nixos/nixpkgs/31ecbaca1bdefa45dffc409f0250bd8039ea0010#firebase-tools -c \
            firebase deploy --only hosting:offline-banner --project lars-software
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json

      - name: Notice (deploy skipped)
        working-directory: website
        if: env.HAS_DEPLOY_KEY != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT secret not set on this repo — site already deployed manually; add the shared lars-software service-account key to enable CI deploys."
