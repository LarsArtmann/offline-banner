name: ci-watch

on:
  schedule:
    # Every 30 minutes: catch a red master within the hour instead of
    # days later (the 2026-10-29 Website red and the 2026-11-05 deploy
    # credentials outage both sat unnoticed).
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: ci-watch
  cancel-in-progress: false

jobs:
  watch:
    # Advisory sentinel: fails (and therefore emails/notifies per repo
    # settings) when the latest run of a watched workflow on master is
    # not a success. Does not build anything itself.
    runs-on: ubuntu-24.04
    steps:
      - name: Check latest master runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail=0
          for workflow in Checks Website; do
            latest=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --branch master \
              --workflow "$workflow" \
              --limit 1 \
              --json conclusion,status,databaseId \
              --jq '.[0] | "\(.databaseId) \(.status) \(.conclusion // "none")"')
            run_id="${latest%% *}"
            rest="${latest#* }"
            status="${rest%% *}"
            conclusion="${rest##* }"
            echo "$workflow: run $run_id status=$status conclusion=$conclusion"
            # An in-flight run has no conclusion yet — judging it red
            # false-fired on 2026-11-18 (21:35, the sentinel raced a
            # passing Checks run mid-boot and paged). Skip it: the next
            # 30-min tick judges the completed result. Only a COMPLETED
            # non-success is a real red.
            if [ "$status" != "completed" ]; then
              echo "$workflow: run $run_id is $status — skipped, next tick judges it"
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::$workflow latest run $run_id on master is '$conclusion'"
              fail=1
            fi
          done
          exit "$fail"
